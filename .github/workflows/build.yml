name: Bauen

# Bei jedem Push bauen und testen. Auf main zusätzlich ein Release mit der Jar (Tag v<Version aus der pom.xml>),
# das MoinMorni automatisch auf den Gipfelsturm-Server spielt.
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Bauen und testen
        run: mvn -B package

      - name: Version aus der pom.xml
        id: version
        run: echo "version=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Morni-Gipfelsturm
          path: target/Morni-Gipfelsturm.jar

      - name: Release (nur auf main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – für ein neues Release die Version in der pom.xml erhöhen."
            exit 0
          fi
          NOTES="docs/releases/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            printf 'Gipfelsturm %s\n\nVerfasst mit Claude 🤖\n' "$TAG" > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi
          gh release create "$TAG" target/Morni-Gipfelsturm.jar --target "$GITHUB_SHA" \
            --title "Gipfelsturm $TAG" --notes-file "$NOTES"
