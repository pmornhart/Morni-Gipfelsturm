name: Gipfelsturm
version: '${project.version}'
main: net.morni.gipfelsturm.GipfelsturmPlugin
api-version: '1.21'
description: Parkour-Strecken von leicht bis extrem, mit Bestzeiten und Strecke der Woche (morni.net).
authors: [morni.net]
website: https://morni.net
# Läuft im Netzwerk morni.net (Sprache, Party, Statistik) und auch ganz allein.
softdepend: [MorniNet]
commands:
  gipfel:
    description: Gipfelsturm – Strecke wählen, Bestenliste, Statistik, Übungsmodus
    usage: /gipfel [start|top|stats|woche|uebung|geist|verstecken|checkpoint|neustart|aufgeben|basislager|mitmachen|lobby]
    aliases: [gs, gipfelsturm, summit]
permissions:
  gipfelsturm.admin:
    description: Zeiten löschen, Welt neu bauen, im Kreativmodus bauen
    default: op
